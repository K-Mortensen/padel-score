<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f3f5f8">
    <meta name="description" content="Record padel matches, build fair teams and climb your club's ranking.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Firematch">
    <title>Firematch · Padel</title>
    <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="assets/icon-180.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/app.css">
    <script>
        // Apply saved theme before first paint to avoid a flash.
        try { var t = localStorage.getItem('padel-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
    <script type="module" src="js/main.js"></script>
</head>
<body>
    <div id="splash" class="splash">
        <span class="logo-mark lg pulse" aria-hidden="true"></span>
        <noscript><p>Firematch needs JavaScript enabled.</p></noscript>
    </div>

    <main id="auth" class="auth" hidden></main>

    <div id="shell" class="shell" hidden>
        <header id="topbar" class="topbar"></header>
        <main id="view" class="view"></main>
        <nav id="nav" class="nav" aria-label="Main"></nav>
    </div>

    <div id="sheets"></div>
    <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
